<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🍪 ISOHungry</title>
<style>
  :root {
    --bg:#1b1410; --card:#261c16; --edge:#3a2b22; --ink:#f5e6d3;
    --dim:#a89684; --cookie:#d99b45; --good:#7fb069; --bad:#d1495b;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#faf4ec; --card:#fff; --edge:#e6d9c9; --ink:#2b1f17;
            --dim:#7a6a5a; --cookie:#b8762a; }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; padding:1.5rem 1rem 3rem; background:var(--bg); color:var(--ink);
    font:15px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  h1 { font-size:1.5rem; margin:0 0 .25rem; }
  .sub { color:var(--dim); font-size:.85rem; margin-bottom:1.5rem; }
  h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.1em;
       color:var(--dim); margin:2rem 0 .75rem; font-weight:600; }
  .card {
    background:var(--card); border:1px solid var(--edge); border-radius:10px;
    padding:.9rem 1rem; margin-bottom:.6rem;
  }
  .row { display:flex; align-items:baseline; gap:.6rem; flex-wrap:wrap; }
  .dev { font-weight:700; color:var(--cookie); min-width:3.2rem; }
  .status { flex:1; min-width:12rem; }
  .time { color:var(--dim); font-variant-numeric:tabular-nums; font-size:.85rem; }
  .bar {
    height:7px; background:var(--edge); border-radius:4px; overflow:hidden;
    margin-top:.7rem;
  }
  .bar i { display:block; height:100%; background:var(--cookie); width:0;
           transition:width .6s ease; }
  .meta { color:var(--dim); font-size:.8rem; margin-top:.45rem; }
  .name-row { display:flex; gap:.4rem; margin-top:.7rem; }
  input {
    flex:1; min-width:0; background:var(--bg); border:1px solid var(--edge);
    color:var(--ink); border-radius:6px; padding:.4rem .6rem; font:inherit;
    font-size:.85rem;
  }
  input:focus { outline:2px solid var(--cookie); outline-offset:-1px; }
  button {
    background:var(--cookie); color:#1b1410; border:0; border-radius:6px;
    padding:.4rem .8rem; font:inherit; font-size:.85rem; font-weight:700;
    cursor:pointer; white-space:nowrap;
  }
  button:hover { filter:brightness(1.1); }
  button.ghost { background:transparent; color:var(--dim);
                 border:1px solid var(--edge); font-weight:400; }
  a.dl { color:var(--cookie); text-decoration:none; font-weight:700; }
  a.dl:hover { text-decoration:underline; }
  /* Narrow screens: the name takes its own line and the size + actions sit
     below it, rather than the download arrow wrapping off on its own. */
  .iso { display:flex; align-items:center; gap:.5rem .6rem; flex-wrap:wrap; }
  .iso .nm { flex:1 1 100%; word-break:break-word; }
  .iso .time { margin-right:auto; }
  @media (min-width: 520px) {
    .iso .nm { flex:1 1 auto; min-width:11rem; }
    .iso .time { margin-right:0; }
  }
  .empty { color:var(--dim); font-style:italic; }
  .setting {
    display:flex; align-items:center; gap:.8rem; flex-wrap:wrap;
    padding:.45rem 0; border-bottom:1px solid var(--edge);
  }
  .setting:last-of-type { border-bottom:0; }
  .setting label { flex:1 1 11rem; display:flex; flex-direction:column; }
  .setting label em { color:var(--dim); font-size:.75rem; font-style:normal; }
  .setting select {
    flex:1 1 13rem; background:var(--bg); color:var(--ink); font:inherit;
    font-size:.85rem; border:1px solid var(--edge); border-radius:6px; padding:.35rem .5rem;
  }
  .setting select:focus { outline:2px solid var(--cookie); outline-offset:-1px; }
  .badge {
    display:inline-block; margin-left:.4rem; padding:.05rem .4rem; border-radius:4px;
    background:var(--bad); color:#fff; font-size:.68rem; font-weight:700;
    vertical-align:middle; white-space:nowrap;
  }
  .toast {
    position:fixed; left:50%; bottom:1.5rem; transform:translateX(-50%);
    background:var(--cookie); color:#1b1410; padding:.6rem 1.1rem;
    border-radius:8px; font-weight:700; opacity:0; pointer-events:none;
    transition:opacity .25s;
  }
  .toast.on { opacity:1; }
  footer { color:var(--dim); font-size:.78rem; margin-top:2.5rem; text-align:center;
           line-height:1.9; }
  footer a { color:var(--cookie); text-decoration:none; }
  footer a:hover { text-decoration:underline; }
  #logview {
    background:#000; color:#c8e6a0; border:1px solid var(--edge); border-radius:10px;
    padding:.9rem 1rem; margin:.6rem 0 0; max-height:22rem; overflow:auto;
    font-size:.78rem; line-height:1.45; white-space:pre-wrap; word-break:break-word;
  }
  #logview .hdr { color:var(--cookie); font-weight:700; }

  /* --- disc review (fork addition) --- */
  .badge.ok   { background:var(--good); }
  .badge.warn { background:var(--cookie); color:#1b1410; }
  .modal {
    position:fixed; inset:0; background:rgba(0,0,0,.65); display:none;
    align-items:flex-start; justify-content:center; padding:2rem 1rem; z-index:20;
    overflow-y:auto;
  }
  .modal.on { display:flex; }
  .sheet {
    background:var(--card); border:1px solid var(--edge); border-radius:12px;
    padding:1.25rem; width:100%; max-width:44rem;
  }
  .sheet h3 { margin:0 0 .35rem; font-size:1.05rem; }
  .sheet .hint { color:var(--dim); font-size:.8rem; margin-bottom:1rem; }
  .pick {
    display:flex; gap:.6rem; align-items:center; padding:.5rem;
    border:1px solid var(--edge); border-radius:8px; margin-bottom:.4rem;
    cursor:pointer; background:var(--bg);
  }
  .pick:hover { border-color:var(--cookie); }
  .pick.sel   { border-color:var(--cookie); outline:1px solid var(--cookie); }
  .pick img { width:34px; height:51px; object-fit:cover; border-radius:3px;
              background:var(--edge); flex:0 0 auto; }
  .pick .t { flex:1; min-width:0; }
  .pick .t b { display:block; font-size:.9rem; }
  .pick .t small { color:var(--dim); font-size:.75rem; }
  .titlerow {
    display:flex; gap:.5rem; align-items:center; padding:.35rem 0;
    border-bottom:1px solid var(--edge);
  }
  .titlerow input[type=text] { flex:1; font-size:.85rem; min-width:6rem; }
  .dirsel {
    flex:0 0 auto; background:var(--bg); color:var(--ink); font:inherit;
    font-size:.75rem; border:1px solid var(--edge); border-radius:6px;
    padding:.3rem .35rem; max-width:9rem;
  }
  .titlerow .dur { color:var(--dim); font-size:.78rem;
                   font-variant-numeric:tabular-nums; min-width:4.5rem; }
  .rowbtns { display:flex; gap:.5rem; margin-top:1rem; flex-wrap:wrap; }
  .skiplist { color:var(--dim); font-size:.75rem; margin-top:.6rem; line-height:1.5; }
  .joblog {
    background:#000; color:#c8e6a0; border-radius:8px; padding:.6rem .8rem;
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.75rem;
    max-height:14rem; overflow:auto; margin-top:.75rem; white-space:pre-wrap;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🍪 ISOHungry</h1>
  <div class="sub" id="sub">me eat DVD…</div>

  <h2>Drives</h2>
  <div id="drives"><div class="card empty">looking for drives…</div></div>

  <h2>Recently eaten</h2>
  <div id="isos"><div class="card empty">nothing yet</div></div>

  <h2>Disc catalogue</h2>
  <div id="discdb"><div class="card empty">loading…</div></div>

  <h2>Settings</h2>
  <div id="settings"><div class="card empty">loading…</div></div>

  <div class="modal" id="review">
    <div class="sheet" id="reviewSheet"></div>
  </div>

  <h2>Logs</h2>
  <div id="logs"><div class="card empty">no logs yet</div></div>
  <pre id="logview" hidden></pre>

  <footer>
    status refreshes every 2s · renaming is the only thing this page can change<br>
    <a href="https://github.com/JamesDavid/ISOHungry" target="_blank" rel="noopener noreferrer">
      🍪 ISOHungry on GitHub
    </a>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let editing = null;   // don't clobber an input the user is typing in

const gb = b => b >= 1e9 ? (b/1e9).toFixed(2)+' GB'
              : b >= 1e6 ? (b/1e6).toFixed(0)+' MB'
              : b >= 1e3 ? (b/1e3).toFixed(0)+' KB'
              : (b|0)+' B';   // sub-KB files read "0 KB" otherwise

function hms(start) {
  if (!start) return '--:--:--';
  let s = Math.max(0, Math.floor(Date.now()/1000) - start);
  const h = Math.floor(s/3600), m = Math.floor(s/60)%60;
  return [h, m, s%60].map(n => String(n).padStart(2,'0')).join(':');
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 1800);
}

async function post(url, body) {
  let r;
  try {
    r = await fetch(url, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
  } catch (e) {
    // Connection died outright — say so rather than failing silently.
    toast('no answer from the kitchen');
    return null;
  }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { toast(j.error || ('failed (' + r.status + ')')); return null; }
  return j;
}

function drawDrives(drives) {
  const box = $('#drives');
  if (!drives.length) {
    box.innerHTML = '<div class="card empty">no drives — plug one in</div>';
    return;
  }
  box.innerHTML = drives.map(d => {
    const busy = d.phase === 'ripping' || d.phase === 'iso';
    const inputId = 'nm-' + d.device;
    // Audio progresses in tracks; everything else in bytes. Encoded audio is a
    // fraction of the raw disc, so bytes would badly understate an audio rip.
    const byTrack = d.kind === 'audio' && d.tracks_total > 0;
    const pct = byTrack ? Math.min(100, 100*d.tracks_done/d.tracks_total)
              : d.bytes_total ? Math.min(100, 100*d.bytes_done/d.bytes_total) : 0;
    const detail = byTrack ? `track ${d.tracks_done} of ${d.tracks_total}`
                 : d.bytes_total ? `${gb(d.bytes_done)} of ${gb(d.bytes_total)}` : '';
    return `
      <div class="card">
        <div class="row">
          <span class="dev">${d.device}</span>
          <span class="status">${esc(d.status)}</span>
          <span class="time">${hms(d.start)}</span>
        </div>
        ${busy && detail ? `
          <div class="bar"><i style="width:${pct}%"></i></div>
          <div class="meta">${detail} · ${pct.toFixed(0)}%</div>` : ''}
        ${busy && d.fp ? `
          <div class="name-row">
            <input id="${inputId}" placeholder="name it (applied when finished)"
                   value="${esc(d.pending_name)}">
            <button onclick="setName('${d.fp}','${inputId}')">Set</button>
          </div>` : ''}
      </div>`;
  }).join('');
}

function drawIsos(isos) {
  const box = $('#isos');
  if (!isos.length) {
    box.innerHTML = '<div class="card empty">nothing yet — me still hungry</div>';
    return;
  }
  const icon = {movies:'🎬', music:'🎵', data:'💾'};
  const rbadge = {
    new:       '<span class="badge warn">needs review</span>',
    inspected: '<span class="badge warn">needs review</span>',
    importing: '<span class="badge warn">importing…</span>',
    imported:  '<span class="badge ok">in library</span>',
    failed:    '<span class="badge">import failed</span>',
    skipped:   '',
  };
  box.innerHTML = isos.map(i => `
    <div class="card iso">
      <span class="nm">${icon[i.kind]||'💿'} ${esc(i.name)}
        ${i.needs_id ? '<span class="badge">not identified</span>' : ''}
        ${i.kind === 'movies' && i.review ? (rbadge[i.review] || '') : ''}</span>
      <span class="time">${gb(i.size)}${i.tracks ? ' · '+i.tracks+' tracks' : ''}</span>
      ${i.needs_id ? `<button onclick="identify('${esc(i.rel)}','${esc(i.name)}')">Identify</button>` : ''}
      ${i.kind === 'movies' && REVIEW_ON
        ? `<button onclick="review('${esc(i.rel)}')">${
             i.review === 'imported' ? 'Re-import' : 'Identify &amp; import'}</button>`
        : ''}
      <button class="ghost" onclick="rename('${esc(i.rel)}','${esc(i.name)}')">Rename</button>
      ${i.kind === 'music' ? ''
        : `<a class="dl" href="/download/${i.rel.split('/').map(encodeURIComponent).join('/')}">↓</a>`}
    </div>`).join('');
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- disc review (fork addition) ----------------
   A disc arrives as numbered titles and a volume label. Nothing on it names
   the film, so nothing is written into the library until someone confirms
   which film it is and what the extras are called. */
let REVIEW_ON = false;
let RV = null;          // {rel, data, chosen, jobId}
let DISCDB = {};

// The folder names Plex recognises for extras. TheDiscDb's categories map onto
// these, and the dropdown lets a wrong guess be corrected before importing.
const PLEX_DIRS = ['Featurettes', 'Behind The Scenes', 'Deleted Scenes',
                   'Interviews', 'Scenes', 'Shorts', 'Trailers', 'Other'];

const namedCount = d => (d.extras || []).filter(t => t.source === 'thediscdb').length;

async function review(rel) {
  RV = {rel, data: null, chosen: null, jobId: null};
  openSheet(`<h3>Reading the disc…</h3>
             <div class="hint">Listing titles and looking for a match.</div>`);
  const r = await fetch('/api/review/inspect?rel=' + encodeURIComponent(rel))
                  .then(x => x.json()).catch(() => null);
  if (!r || r.error) {
    openSheet(`<h3>Could not read that disc</h3>
      <div class="hint">${esc(r?.error || 'the server did not answer')}</div>
      <div class="rowbtns"><button class="ghost" onclick="closeSheet()">Close</button></div>`);
    return;
  }
  RV.data = r;
  RV.chosen = r.suggestion || null;
  drawReview();
}

// What the catalogue had to say. An exact hit is stated as such; a runtime
// guess is labelled a guess, because it is one.
function discdbLine(d) {
  const db = d.discdb;
  if (!db) return '';
  if (!db.matched) {
    return `<div class="hint">TheDiscDb: <b>${esc(db.reason || 'no match')}</b>.
      Names below are placeholders — once you've named them, this disc can be
      contributed back so the next person gets them for free.</div>`;
  }
  const exact = db.how === 'contenthash';
  return `<div class="hint">TheDiscDb: <span class="badge ${exact ? 'ok' : 'warn'}">${
    exact ? 'exact disc match' : 'runtime guess ' + db.confidence}</span>
    ${esc(db.movie)} (${esc(db.year)}) — ${esc(db.release)}.
    ${exact ? 'Identified by the VIDEO_TS file sizes, so this is the same pressing.'
            : 'Matched on runtimes only — check the names before importing.'}</div>`;
}

function movieCard(m, i) {
  const sel = RV.chosen && RV.chosen.tmdbId === m.tmdbId ? ' sel' : '';
  return `<div class="pick${sel}" onclick="chooseMovie(${i})">
    ${m.poster ? `<img src="${esc(m.poster)}" alt="" loading="lazy">` : '<img alt="">'}
    <div class="t"><b>${esc(m.title)} (${esc(m.year)})</b>
      <small>${m.in_library ? 'in your library' : 'not in library — will be added to Radarr'}
      ${m.score != null ? ' · match ' + m.score : ''}</small></div>
  </div>`;
}

let SHOWN = [];
function chooseMovie(i) { RV.chosen = SHOWN[i]; drawReview(); }

function drawReview() {
  const d = RV.data;
  SHOWN = d.suggestion
    ? [d.suggestion, ...d.candidates.filter(c => c.tmdbId !== d.suggestion.tmdbId)]
    : d.candidates.slice();
  if (RV.chosen && !SHOWN.some(m => m.tmdbId === RV.chosen.tmdbId)) SHOWN.unshift(RV.chosen);

  const c = RV.chosen;
  const newToLibrary = c && !c.in_library;

  openSheet(`
    <h3>${d.suggestion ? 'Is this the right film?' : 'Which film is this?'}</h3>
    <div class="hint">
      Read from <b>${esc(d.iso.split('/').pop())}</b> — disc label looked like
      “${esc(d.guess || 'nothing usable')}”. Feature runs ${esc(d.feature.duration)},
      ${d.extras.length} extra${d.extras.length === 1 ? '' : 's'} found.
      ${d.suggestion ? '' : ' No confident match, so nothing is pre-selected.'}
    </div>
    ${discdbLine(d)}

    ${SHOWN.map(movieCard).join('') || '<div class="hint">No candidates — search below.</div>'}

    <div class="titlerow" style="border:0;margin-top:.5rem">
      <input type="text" id="rvSearch" placeholder="search by title, e.g. Alien 3 1992"
             value="${esc(RV.search ?? d.guess ?? '')}"
             onkeydown="if(event.key==='Enter')searchMovies()">
      <button class="ghost" onclick="searchMovies()">Search</button>
    </div>
    ${!d.suggestion && !d.candidates.length ? `<div class="hint">
      DVD volume labels can't contain spaces, so this one arrived squashed and
      matched nothing. Put the spaces back and search — e.g.
      “${esc(spaceHint(d.guess))}”.</div>` : ''}

    ${c ? `
      <div class="hint" style="margin:1rem 0 .3rem">
        ${newToLibrary
          ? `<b>${esc(c.title)} (${esc(c.year)})</b> isn't in the library yet.
             It'll be added to Radarr so Radarr names the folder, then the main
             title is ripped in alongside the extras — Radarr upgrades it later.`
          : `Extras go to <b>${esc(c.path)}/Featurettes/</b>. The existing
             film file is left alone.`}
      </div>

      <label class="titlerow" style="border:0">
        <input type="checkbox" id="rvFeature" ${newToLibrary ? 'checked' : ''}
               onchange="drawReviewKeep()" style="flex:0">
        <span style="flex:1;font-size:.85rem">Also rip the main feature
          (${esc(d.feature.duration)})${c.hasFile && !newToLibrary
            ? ' — <b>you already have a file for this film</b>' : ''}</span>
      </label>

      <div class="hint" style="margin:.8rem 0 .2rem">
        ${namedCount(d) ? `Extras — <b>${namedCount(d)} of ${d.extras.length}</b>
           named from TheDiscDb. Check them, then import:`
          : `Extras — name them from the disc menu, untick anything you don't want:`}
      </div>
      ${d.extras.map((t, i) => `
        <label class="titlerow">
          <input type="checkbox" ${t.include ? 'checked' : ''} id="rvInc${i}" style="flex:0">
          <span class="dur">${esc(t.duration)}</span>
          <input type="text" id="rvName${i}" value="${esc(t.name)}">
          <select id="rvDir${i}" class="dirsel">${
            PLEX_DIRS.map(dir => `<option${dir === (t.subdir || 'Featurettes')
              ? ' selected' : ''}>${dir}</option>`).join('')}</select>
          ${t.source === 'thediscdb'
            ? '<span class="badge ok" title="name from TheDiscDb">db</span>' : ''}
        </label>`).join('') || '<div class="hint">No extras detected on this disc.</div>'}

      ${d.skipped.length ? `<div class="skiplist"><b>Skipped:</b><br>` +
        d.skipped.map(s => `title ${s.ix} · ${esc(s.duration)} — ${esc(s.reason)}`)
                 .join('<br>') + '</div>' : ''}
    ` : ''}

    <div class="rowbtns">
      ${c ? `<button onclick="confirmImport()">
               ${newToLibrary ? 'Add to Radarr &amp; import' : 'Import extras'}</button>` : ''}
      ${c && d.discdb && !d.discdb.matched
        ? `<button class="ghost" onclick="contribute()"
             title="Write a submission for TheDiscDb so the next person gets these names">
             Contribute names to TheDiscDb</button>` : ''}
      <button class="ghost" onclick="skipDisc()">Not now</button>
      <button class="ghost" onclick="closeSheet()">Cancel</button>
    </div>`);
}

// Redraw without losing what the user has typed into the extras rows.
function drawReviewKeep() {
  const feat = document.getElementById('rvFeature');
  if (feat) RV.data._feat = feat.checked;
  readTitleEdits();
  drawReview();
  const f = document.getElementById('rvFeature');
  if (f && RV.data._feat !== undefined) f.checked = RV.data._feat;
}

function readTitleEdits() {
  (RV.data.extras || []).forEach((t, i) => {
    const nm = document.getElementById('rvName' + i);
    const inc = document.getElementById('rvInc' + i);
    const dir = document.getElementById('rvDir' + i);
    if (nm) t.name = nm.value;
    if (inc) t.include = inc.checked;
    if (dir) t.subdir = dir.value;
  });
}

// Strip the aspect-ratio / edition noise DVD labels carry, leaving the part
// that is actually the title. Only a hint for the search box — the user still
// has to put the word breaks back, which no heuristic gets right.
function spaceHint(guess) {
  return String(guess || '').replace(/\s*\b\d(?:X|x)\d\b\s*/g, ' ').trim();
}

async function searchMovies() {
  const q = (document.getElementById('rvSearch') || {}).value || '';
  if (q.trim().length < 2) { toast('type at least two characters'); return; }
  RV.search = q;
  readTitleEdits();
  toast('searching…');
  const r = await fetch('/api/review/search?q=' + encodeURIComponent(q))
                  .then(x => x.json()).catch(() => null);
  if (!r || r.error) { toast(r?.error || 'search failed'); return; }
  // Library hits first: importing into a film already tracked is the common
  // case, and adding a duplicate to Radarr is the expensive mistake.
  const seen = new Set();
  RV.data.candidates = [...(r.library || []), ...(r.tmdb || [])]
    .filter(m => !seen.has(m.tmdbId) && seen.add(m.tmdbId));
  RV.data.suggestion = null;
  drawReview();
}

async function confirmImport() {
  readTitleEdits();
  const feat = document.getElementById('rvFeature');
  const body = {
    rel: RV.rel,
    tmdbId: RV.chosen.tmdbId,
    includeFeature: !!(feat && feat.checked),
    featureIx: RV.data.feature.ix,
    extras: RV.data.extras.map(t => ({ix: t.ix, name: t.name,
                                      include: t.include, subdir: t.subdir})),
  };
  if (!body.includeFeature && !body.extras.some(t => t.include)) {
    toast('nothing selected to import'); return;
  }
  const r = await post('/api/review/import', body);
  if (!r) return;
  RV.jobId = r.job;
  if (r.created_movie) toast('added to Radarr — encoding now');
  pollJob();
}

async function pollJob() {
  const j = await fetch('/api/review/job?id=' + encodeURIComponent(RV.jobId))
                  .then(x => x.json()).catch(() => null);
  if (!j) { setTimeout(pollJob, 2000); return; }
  const done = j.status === 'done' || j.status === 'failed';
  openSheet(`
    <h3>${done ? (j.status === 'done' ? 'Imported' : 'Import finished with errors')
                : 'Importing…'}</h3>
    <div class="hint">
      ${esc((j.movie && j.movie.title) || '')} ${j.encoder ? '· ' + esc(j.encoder) : ''}
      ${j.total ? ` · ${j.done||0}/${j.total}` : ''}
      ${j.current ? '<br>encoding ' + esc(j.current) : ''}
    </div>
    ${j.error ? `<div class="hint">${esc(j.error)}</div>` : ''}
    <div class="joblog">${(j.log || []).map(esc).join('\n') || 'starting…'}</div>
    <div class="rowbtns">
      <button class="ghost" onclick="closeSheet()">${done ? 'Close' : 'Run in background'}</button>
    </div>`);
  if (!done) setTimeout(pollJob, 2000);
  else refresh();
}

async function contribute() {
  readTitleEdits();
  const d = RV.data, c = RV.chosen;
  const r = await post('/api/review/contribute', {
    rel: RV.rel,
    movie: {title: c.title, year: c.year, tmdbId: c.tmdbId},
    featureIx: d.feature.ix,
    featureSeconds: d.feature.seconds,
    extras: d.extras.map(t => ({ix: t.ix, seconds: t.seconds, name: t.name,
                                subdir: t.subdir, include: t.include})),
  });
  if (!r) return;
  openSheet(`
    <h3>Submission written</h3>
    <div class="hint">
      ${r.named} of ${r.titles} titles named, keyed on disc hash
      <code>${esc(r.content_hash)}</code>.
    </div>
    <div class="joblog">${esc(r.release_dir)}</div>
    <div class="hint" style="margin-top:.8rem">
      To contribute: fork <b>github.com/TheDiscDb/data</b>, copy that
      <code>data/</code> tree in, and open a pull request. Check the names
      against the disc packaging first — a wrong name in a shared catalogue is
      worse than a gap.
    </div>
    <div class="rowbtns"><button class="ghost" onclick="closeSheet()">Close</button></div>`);
}

function drawDiscdb() {
  const box = $('#discdb');
  if (!box) return;
  if (!DISCDB.available) {
    box.innerHTML = '<div class="card empty">catalogue lookup unavailable</div>';
    return;
  }
  const when = DISCDB.built
    ? new Date(DISCDB.built * 1000).toLocaleString() : 'never';
  box.innerHTML = `<div class="card iso">
    <span class="nm">🗃 TheDiscDb${DISCDB.synced
      ? ` — <b>${DISCDB.discs}</b> DVDs indexed` : ' — not downloaded yet'}</span>
    <span class="time">${DISCDB.synced ? 'updated ' + esc(when) : '~290 MB'}</span>
    <button class="ghost" onclick="syncDiscdb()">
      ${DISCDB.synced ? 'Refresh' : 'Download'}</button>
  </div>`;
}

async function syncDiscdb() {
  const r = await post('/api/review/discdb-sync', {});
  if (!r) return;
  RV = {jobId: r.job};
  toast('fetching the catalogue…');
  pollJob();
}

async function skipDisc() {
  await post('/api/review/skip', {rel: RV.rel});
  closeSheet(); refresh();
}

function openSheet(html) {
  $('#reviewSheet').innerHTML = html;
  $('#review').classList.add('on');
}
function closeSheet() { $('#review').classList.remove('on'); }

async function setName(fp, inputId) {
  const el = document.getElementById(inputId);
  const r = await post('/api/pending', {fp, name: el.value});
  if (r) toast(r.name ? 'will save as ' + r.name + '.iso' : 'name cleared');
  editing = null; refresh();
}

async function identify(rel, shown) {
  const suggested = shown.split('/').pop().replace(/_/g, ' ');
  const q = prompt('Search MusicBrainz for:\n(artist and album works best)', suggested);
  if (q === null) return;

  toast('searching…');
  const r = await post('/api/identify', {rel, query: q});
  if (!r) return;
  if (r.error) { toast(r.error); return; }
  if (!r.matches || !r.matches.length) { toast('no matches'); return; }

  // * marks releases whose track count agrees with what's on disk — the
  // strongest signal that it's the right release.
  const list = r.matches.map((m, n) =>
    `${m.count === r.files ? '*' : ' '}${n}  ${m.artist} — ${m.title}` +
    `${m.date ? ' ('+m.date+')' : ''}  ${m.count} tracks`).join('\n');
  const pick = prompt(
    `${r.files} files on disk. * = track count agrees.\n\n${list}\n\n` +
    `Enter a number to apply, or Cancel:`, '0');
  if (pick === null) return;

  toast('applying…');
  const a = await post('/api/identify', {rel, query: q, apply: true, pick: parseInt(pick, 10) || 0});
  if (!a) return;
  if (a.error) { toast(a.error); return; }
  toast(`tagged ${a.tracks} tracks: ${a.artist} — ${a.album}`);
  refresh();
}

async function rename(rel, shown) {
  const base = shown.replace(/\.iso$/,'').split('/').pop();
  const to = prompt('New name for ' + shown + '\n(no extension needed)', base);
  if (to === null) return;
  const r = await post('/api/rename', {from: rel, to});
  if (r) { toast('renamed to ' + r.name); refresh(); }
}

const SETTINGS = [
  {key:'AUDIO_FORMAT', label:'Music format', hint:'FLAC is lossless and roughly 4x larger',
   opts:[['mp3','MP3 (LAME -V0, ~245kbps)'],['flac','FLAC (lossless)']]},
  {key:'RIP_DATA_DISCS', label:'Data discs', hint:'Non-video, non-audio discs',
   opts:[['1','Rip to an ISO image'],['0','Ignore them']]},
  {key:'AUDIO_CDPARANOIA_OPTS', label:'CD read care', hint:'Lower care gets past scratches, less accurately',
   opts:[['','Full paranoia (best quality)'],['-Y','Less paranoid (faster)'],['-Z','None (for damaged discs)']]},
  {key:'MAX_PARALLEL', label:'Discs at once', hint:'Drives sharing a USB controller thrash above 2',
   opts:[['1','1'],['2','2'],['3','3'],['4','4']]},
  {key:'AUDIO_RIP_TIMEOUT', label:'Give up after', hint:'Keeps whatever was read by then',
   opts:[['1800','30 minutes'],['5400','90 minutes'],['10800','3 hours'],['0','never']]},
];

let settingsDirty = false;

async function drawSettings() {
  if (settingsDirty) return;              // don't clobber a half-made choice
  let d;
  try { d = await (await fetch('/api/settings')).json(); } catch { return; }
  const cur = d.settings || {};
  $('#settings').innerHTML = `<div class="card">` + SETTINGS.map(s => `
      <div class="setting">
        <label for="set-${s.key}">${esc(s.label)}<em>${esc(s.hint)}</em></label>
        <select id="set-${s.key}" onchange="saveSetting('${s.key}')">
          ${s.opts.map(([v, t]) =>
            `<option value="${esc(v)}"${String(cur[s.key]) === v ? ' selected' : ''}>${esc(t)}</option>`
          ).join('')}
        </select>
      </div>`).join('') +
    `<div class="meta">Changes apply to the next disc — a rip already running is unaffected.</div></div>`;
}

async function saveSetting(key) {
  const el = document.getElementById('set-' + key);
  settingsDirty = true;
  const r = await post('/api/settings', {[key]: el.value});
  settingsDirty = false;
  if (r) toast('saved');
  drawSettings();
}

let openLog = null;

async function drawLogs() {
  let logs = [];
  try { logs = await (await fetch('/api/logs')).json(); } catch { return; }
  const box = $('#logs');
  if (!logs.length) {
    box.innerHTML = '<div class="card empty">no logs yet</div>';
    return;
  }
  box.innerHTML = logs.map(l => `
    <div class="card iso">
      <span class="nm">${esc(l.name)}</span>
      <span class="time">${gb(l.size)}</span>
      <button class="ghost" onclick="viewLog('${esc(l.name)}')">
        ${openLog === l.name ? 'Hide' : 'View'}
      </button>
    </div>`).join('');
}

async function viewLog(name) {
  const pre = $('#logview');
  if (openLog === name) { openLog = null; pre.hidden = true; drawLogs(); return; }
  openLog = name;
  await loadLog();
  drawLogs();
}

async function loadLog() {
  if (!openLog) return;
  const pre = $('#logview');
  try {
    const d = await (await fetch('/api/log/' + encodeURIComponent(openLog))).json();
    const atBottom = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 40;
    pre.innerHTML = `<span class="hdr">${esc(d.name)} — last ${d.lines.length} lines</span>\n\n`
                  + esc(d.lines.join('\n'));
    pre.hidden = false;
    if (atBottom) pre.scrollTop = pre.scrollHeight;   // follow the tail
  } catch { /* keep whatever is on screen */ }
}

async function refresh() {
  let d;
  try { d = await (await fetch('/api/status')).json(); }
  catch { $('#sub').textContent = 'lost contact with the kitchen…'; return; }

  const busy = d.drives.filter(x => x.phase === 'ripping' || x.phase === 'iso').length;
  $('#sub').textContent =
    `${d.drives.length} drive${d.drives.length===1?'':'s'} · ${busy} eating · ` +
    `${gb(d.free_bytes)} tummy space left`;

  REVIEW_ON = !!d.review_enabled;
  DISCDB = d.discdb || {};
  if (!editing) drawDrives(d.drives);
  drawIsos(d.isos);
  drawDiscdb();
  drawLogs();
  drawSettings();
  loadLog();
}

// Pause redraws while a name field has focus, so typing isn't interrupted.
document.addEventListener('focusin',  e => { if (e.target.tagName==='INPUT') editing = e.target.id; });
document.addEventListener('focusout', e => { if (e.target.tagName==='INPUT') editing = null; });

refresh();
setInterval(refresh, 2000);
setInterval(() => document.querySelectorAll('.time').forEach(() => {}), 1000);
</script>
